name: Deploy Ticketing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SECRET }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            cd /root/afresh/Ticketing
            # The VPS GitHub SSH key is rejected. Fetch this commit over HTTPS
            # with the short-lived Actions token instead of `git fetch origin`.
            git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/Afresh-Revolution/Ticketing.git" "+refs/heads/main:refs/remotes/origin/main"
            git checkout -f -B main origin/main
            npm install
            npm run build
            systemctl reload nginx
            pm2 restart wav || pm2 start serve --name wav -- -s dist -l 5107
            pm2 save || true
